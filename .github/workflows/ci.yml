name: Build and test churn API

on:
  push:
    branches:
      - main
      - feature/mlops-adaptation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -f dockerfile -t telco-churn-api:ci .

      - name: Start API container
        run: |
          docker run -d \
            --name telco-churn-ci \
            --mount type=bind,source="$GITHUB_WORKSPACE/scripts",target=/app/scripts,readonly \
            telco-churn-api:ci

      - name: Wait for healthy API
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' telco-churn-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs telco-churn-ci
              exit 1
            fi
            sleep 2
          done
          docker logs telco-churn-ci
          exit 1

      - name: Run prediction and input validation tests
        run: |
          docker exec \
            -e API_BASE_URL=http://127.0.0.1:8000 \
            telco-churn-ci \
            python /app/scripts/test_api_adapted.py

      - name: Show container logs
        if: always()
        run: docker logs telco-churn-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f telco-churn-ci || true